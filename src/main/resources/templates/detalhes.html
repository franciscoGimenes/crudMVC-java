<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Aluno</title>
</head>
<body>

<h1>Detalhes do Aluno</h1>

<p>
    <strong>ID:</strong>
    <span th:text="${aluno.id}"></span>
</p>

<p>
    <strong>Nome:</strong>
    <span th:text="${aluno.nome}"></span>
</p>

<p>
    <strong>Email:</strong>
    <span th:text="${aluno.email}"></span>
</p>

<p>
    <strong>Curso:</strong>
    <span th:text="${aluno.curso}"></span>
</p>

<a href="/alunos">Voltar</a>

</body>
</html>
